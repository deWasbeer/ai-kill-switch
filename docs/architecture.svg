<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6470"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d13d36"/></marker>
    <style>
      .grp{fill:#f4f5f7;stroke:#c9ced6;stroke-width:1.5}
      .node{fill:#fff;stroke:#9aa3ad;stroke-width:1.2}
      .gh{font-size:16px;font-weight:700;fill:#1d2025}
      .gs{font-size:12px;fill:#5b6470}
      .t{font-size:14px;font-weight:650;fill:#1d2025}
      .s{font-size:12px;fill:#5b6470}
      .lbl{font-size:12px;font-weight:600}
      .flow{stroke:#5b6470;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .ctl{stroke:#2f6fd0;stroke-width:1.8;fill:none;marker-end:url(#b)}
      .off{stroke:#d13d36;stroke-width:1.8;fill:none;marker-end:url(#r)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#1d2025">ai-kill-switch architecture</text>
  <text x="30" y="66" class="gs">Reference setup: OpenWrt router with AdGuard Home, Raspberry Pi as switch host. With Pi-hole, the DNS filter moves onto the Pi.</text>

  <!-- Groups -->
  <rect class="grp" x="30" y="90" width="270" height="470" rx="14"/>
  <text class="gh" x="48" y="118">Home network</text>
  <rect class="grp" x="370" y="90" width="320" height="470" rx="14"/>
  <text class="gh" x="388" y="118">Router (OpenWrt)</text>
  <rect class="grp" x="760" y="90" width="410" height="470" rx="14"/>
  <text class="gh" x="778" y="118">Switch host (Raspberry Pi)</text>

  <!-- LAN -->
  <rect class="node" x="50" y="140" width="230" height="60" rx="10"/>
  <text class="t" x="64" y="164">Phones, laptops, TVs</text>
  <text class="s" x="64" y="184">may try their own DNS servers</text>

  <rect class="node" x="50" y="225" width="230" height="60" rx="10"/>
  <text class="t" x="64" y="249">WireGuard VPN clients</text>
  <text class="s" x="64" y="269">routed through the switch host</text>

  <rect x="50" y="315" width="230" height="140" rx="10" fill="#fdf0ef" stroke="#d13d36" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="t" x="64" y="340">Machine running AI agents</text>
  <text class="s" x="64" y="362">e.g. a coding agent with a shell</text>
  <text class="lbl" x="64" y="388" fill="#d13d36">✕ no SSH key or passwords for</text>
  <text class="lbl" x="64" y="404" fill="#d13d36">   the switch host or the router</text>
  <text class="s" x="64" y="428">its lookups are ignored by the</text>
  <text class="s" x="64" y="444">idle timer (IDLE_IGNORE_CLIENTS)</text>

  <!-- Router -->
  <rect class="node" x="390" y="140" width="280" height="60" rx="10"/>
  <text class="t" x="404" y="164">DNS intercept</text>
  <text class="s" x="404" y="184">all port 53 → AdGuard · reject 853 (DoT)</text>

  <rect class="node" x="390" y="235" width="280" height="100" rx="10" stroke="#2f6fd0" stroke-width="1.8"/>
  <text class="t" x="404" y="259">AdGuard Home</text>
  <text class="s" x="404" y="280">blocks ||domain^ of every provider</text>
  <text class="s" x="404" y="296">that is switched off</text>
  <text class="s" x="404" y="318">query log = proof of AI activity</text>

  <rect class="node" x="390" y="370" width="280" height="90" rx="10" stroke="#2f6fd0" stroke-width="1.8"/>
  <text class="t" x="404" y="394">nftables · table inet ai_kill</text>
  <text class="s" x="404" y="415">rejects IP ranges owned by AI</text>
  <text class="s" x="404" y="431">companies (not shared CDNs), so</text>
  <text class="s" x="404" y="447">hard-coded IPs can't get around DNS</text>

  <!-- Switch host -->
  <rect x="780" y="140" width="370" height="70" rx="10" fill="#eef3fc" stroke="#2f6fd0" stroke-width="1.8"/>
  <text class="t" x="796" y="166">ai-switch</text>
  <text class="s" x="796" y="190">ai-on · ai-off · ai-status · ai-whitelist · ai-unwhitelist</text>

  <rect class="node" x="780" y="230" width="180" height="82" rx="10"/>
  <text class="t" x="794" y="253">ai-idle · every 5 min</text>
  <text class="s" x="794" y="274">off after 2 h without AI</text>
  <text class="s" x="794" y="291">traffic, or 8 h after ai-on</text>

  <rect class="node" x="970" y="230" width="180" height="82" rx="10"/>
  <text class="t" x="984" y="253">ai-update · daily</text>
  <text class="s" x="984" y="274">learns new AI domains</text>
  <text class="s" x="984" y="291">and IP ranges</text>

  <rect x="780" y="330" width="370" height="85" rx="10" fill="#fff8ec" stroke="#c27a12" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="t" x="796" y="354" fill="#8a5508">Rule: automation can only switch AI OFF</text>
  <text class="s" x="796" y="376">Turning AI back on = log in here and run ai-on.</text>
  <text class="s" x="796" y="396">Credentials stay in ~/.config/ai-switch (chmod 600).</text>

  <rect class="node" x="780" y="435" width="180" height="105" rx="10"/>
  <text class="t" x="794" y="458">ai-news-watch</text>
  <text class="s" x="794" y="478">every 15 min</text>
  <text class="s" x="794" y="496">≥ 3 sites report a breach</text>
  <text class="s" x="794" y="512">at one AI company in 3 h</text>
  <text class="s" x="794" y="528">→ ai-switch off + alert</text>

  <rect class="node" x="970" y="435" width="180" height="105" rx="10"/>
  <text class="t" x="984" y="458">ai-status-http :8099</text>
  <text class="s" x="984" y="478">read-only page</text>
  <text class="s" x="984" y="496">HTTP 200 = allowed</text>
  <text class="s" x="984" y="512">HTTP 503 = blocked</text>
  <text class="s" x="984" y="528">no way to change anything</text>

  <!-- Outside -->
  <rect class="node" x="390" y="610" width="280" height="70" rx="10"/>
  <text class="t" x="404" y="636">AI providers (Internet)</text>
  <text class="s" x="404" y="657">claude.ai · chatgpt.com · gemini · …</text>

  <rect class="node" x="780" y="610" width="122" height="70" rx="10"/>
  <text class="t" x="792" y="636">Security news</text>
  <text class="s" x="792" y="657">9 RSS feeds</text>
  <rect class="node" x="914" y="610" width="112" height="70" rx="10"/>
  <text class="t" x="926" y="636">Gotify</text>
  <text class="s" x="926" y="657">phone alert</text>
  <rect class="node" x="1038" y="610" width="132" height="70" rx="10"/>
  <text class="t" x="1050" y="636">Dashboard</text>
  <text class="s" x="1050" y="657">green / red dot</text>

  <!-- Legend -->
  <rect class="node" x="30" y="610" width="320" height="130" rx="10"/>
  <text class="t" x="46" y="634">Legend</text>
  <line x1="46" y1="656" x2="96" y2="656" class="flow"/><text class="s" x="106" y="660">network / data flow</text>
  <line x1="46" y1="682" x2="96" y2="682" class="ctl"/><text class="s" x="106" y="686">ai-switch controls the router:</text><text class="s" x="106" y="701">REST API → AdGuard, SSH → nftables</text>
  <line x1="46" y1="724" x2="96" y2="724" class="off"/><text class="s" x="106" y="728">automatic "off" (never "on")</text>

  <!-- Arrows: network -->
  <path class="flow" d="M280 170H388"/>
  <path class="flow" d="M280 255H330V185H388"/>
  <path class="flow" d="M280 385H345V192H388"/>
  <text class="lbl" x="300" y="160" fill="#5b6470">DNS</text>
  <path class="flow" d="M530 200V233"/>
  <path class="flow" d="M530 460V608"/>
  <text class="lbl" x="540" y="540" fill="#5b6470">allowed traffic only</text>

  <!-- Arrows: control -->
  <path class="ctl" d="M780 172H722V285H672"/>
  <text class="lbl" x="678" y="278" fill="#2f6fd0">REST</text>
  <path class="ctl" d="M780 198H740V415H672"/>
  <text class="lbl" x="678" y="408" fill="#2f6fd0">SSH</text>

  <!-- Arrows: automatic off -->
  <path class="off" d="M870 230V212"/>
  <path class="off" d="M780 487H765V205H778"/>

  <!-- Arrows: news + status -->
  <path class="flow" d="M841 610V542"/>
  <path class="flow" d="M930 540L960 608"/>
  <path class="flow" d="M1104 540V608"/>
  <text class="lbl" x="1112" y="582" fill="#5b6470">200/503</text>
</svg>
